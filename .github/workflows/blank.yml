name: Build Multi‑Arch Slim Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  packages: write
  contents: read

jobs:
  build-slim-amd64:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.get-digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AMD64 local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker
          tags: local-build-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Slim AMD64 image
        uses: kitabisa/docker-slim-action@v1
        env:
          DSLIM_HTTP_PROBE: false
          DSLIM_INCLUDE_PATH: /app
          DSLIM_INCLUDE_EXE: /usr/local/bin/arti
        with:
          target: local-build-amd64
          tag: slim

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push slim‑amd64 & get digest
        id: get-digest
        run: |
          SLIM_IMAGE=local-build-amd64:slim
          GHCR_TAG=ghcr.io/${{ github.repository }}:slim-amd64-tmp
          docker tag "$SLIM_IMAGE" "$GHCR_TAG"
          docker push "$GHCR_TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$GHCR_TAG" | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  build-slim-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.get-digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=docker
          tags: local-build-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Slim ARM64 image
        uses: kitabisa/docker-slim-action@v1
        env:
          DSLIM_HTTP_PROBE: false
          DSLIM_INCLUDE_PATH: /app
          DSLIM_INCLUDE_EXE: /usr/local/bin/arti
        with:
          target: local-build-arm64
          tag: slim

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push slim‑arm64 & get digest
        id: get-digest
        run: |
          SLIM_IMAGE=local-build-arm64:slim
          GHCR_TAG=ghcr.io/${{ github.repository }}:slim-arm64-tmp
          docker tag "$SLIM_IMAGE" "$GHCR_TAG"
          docker push "$GHCR_TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$GHCR_TAG" | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  final-manifest:
    runs-on: ubuntu-latest
    needs: [build-slim-amd64, build-slim-arm64]
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi‑arch manifest → latest (slim)
        run: |
          AMD64_DIGEST="${{ needs.build-slim-amd64.outputs.digest }}"
          ARM64_DIGEST="${{ needs.build-slim-arm64.outputs.digest }}"
          docker manifest create ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}@"${AMD64_DIGEST}" \
            ghcr.io/${{ github.repository }}@"${ARM64_DIGEST}"
          docker manifest push ghcr.io/${{ github.repository }}:latest
