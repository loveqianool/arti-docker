name: Build Multi‑Arch Docker Image
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  packages: write
  contents: read

jobs:
  build-slim-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AMD64 to local daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker
          tags: ghcr.io/${{ github.repository }}:tmp-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Slim AMD64
        uses: kitabisa/docker-slim-action@master
        env:
          DSLIM_HTTP_PROBE: false
          DSLIM_INCLUDE_PATH: /app
          DSLIM_INCLUDE_EXE: /usr/local/bin/arti
        with:
          target: ghcr.io/${{ github.repository }}:tmp-amd64
          tag: tmp-slim-amd64

      - name: Push temporary amd64 slim
        run: docker push ghcr.io/${{ github.repository }}:tmp-slim-amd64

  build-slim-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 to local daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=docker
          tags: ghcr.io/${{ github.repository }}:tmp-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Slim ARM64
        uses: kitabisa/docker-slim-action@master
        env:
          DSLIM_HTTP_PROBE: false
          DSLIM_INCLUDE_PATH: /app
          DSLIM_INCLUDE_EXE: /usr/local/bin/arti
        with:
          target: ghcr.io/${{ github.repository }}:tmp-arm64
          tag: tmp-slim-arm64

      - name: Push temporary arm64 slim
        run: docker push ghcr.io/${{ github.repository }}:tmp-slim-arm64

  final-manifest:
    runs-on: ubuntu-latest
    needs: [build-slim-amd64, build-slim-arm64]
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push slim multi‑arch manifest
        run: |
          docker manifest create ghcr.io/${{ github.repository }}:slim \
            ghcr.io/${{ github.repository }}:tmp-slim-amd64 \
            ghcr.io/${{ github.repository }}:tmp-slim-arm64
          docker manifest push ghcr.io/${{ github.repository }}:slim

      - name: Optional clean‑up temporary tags
        run: |
          echo "临时标签 tmp‑* 无需删除；GHCR标签无法直接通过docker cli删除，如需清理请网页端手动删除"
